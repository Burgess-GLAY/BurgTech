databases:
  - name: burgtech-db
    databaseName: burgtech
    user: burgtech_user
    plan: free

services:
  - type: web
    name: burgtech-backend
    env: node
    plan: free
    rootDirectory: backend
    buildCommand: npm install --production=false && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: burgtech-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: burgtech-db
          property: connectionString
      - key: JWT_SECRET
        value: SET_IN_RENDER_ENV
      - key: RESEND_API_KEY
        value: SET_IN_RENDER_ENV
      - key: GROQ_API_KEY
        value: SET_IN_RENDER_ENV
      - key: ADMIN_EMAIL
        value: burgtechsolutions@gmail.com
      - key: FRONTEND_URL
        value: https://burg-tech.vercel.app
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
