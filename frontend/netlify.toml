[build]
  base = "."
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 3000
  publish = ".next"

# Redirect API calls to backend (backend must be deployed separately)
# Replace YOUR_BACKEND_DOMAIN with your actual backend URL after deployment
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_DOMAIN.com/api/:splat"
  status = 200
  force = true

# Handle Next.js rewrites for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
